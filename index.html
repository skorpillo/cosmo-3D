$('#tbd').innerHTML=h;$('#ia').innerHTML='<button id="a1">✈ Viaggio qui</button> <button id="a2">⇄ Confronta</button>';$('#a1').onclick=()=>openT(null,o);$('#a2').onclick=()=>openC(o)}

const M=$('#mod'),OP=D.map((o,i)=>o.fake?'':`<option value="${i}">${o.n}</option>`).join(''),idx=id=>D.findIndex(o=>o.id==id);
const op=h=>{M.innerHTML='<button style="float:right" onclick="M.style.display=\'none\'">✕</button>'+h;M.style.display='block'};
function openT(a,b){op(`<h3>Viaggio & tempi luce</h3>Da <select id="ta">${OP}</select> a <select id="tb2">${OP}</select><div id="tr"></div>`);$('#ta').value=idx('terra');$('#tb2').value=idx((b||byId.marte).id);$('#ta').onchange=$('#tb2').onchange=calc;calc()}
function calc(){const a=D[$('#ta').value],b=D[$('#tb2').value],c=299792.458;let dl,n='';
if(a.lv==1&&b.lv==1){const p=new THREE.Vector3(),q=new THREE.Vector3();pos(a,t,p,1);pos(b,t,q,1);dl=p.distanceTo(q)/63241.077}else{const x=ly(a),y=ly(b);dl=a.id=='terra'?y:b.id=='terra'?x:Math.abs(x-y);if(a.id!='terra'&&b.id!='terra')n='<br><i>Stima minima: distanze misurate dalla Terra.</i>'}

const km=dl*9.4607e12;let h=`<table><tr><td>Distanza</td><td>${fmtN(km)} km<br>${fmtN(dl*63241.077)} AU<br>${fmtN(dl)} ly<br>${fmtN(dl/3.2616e6)} Mpc</td></tr><tr><td>Luce / radio</td><td>${fmtT(dl*31557600)}</td></tr>`;
[['Sonda chimica (17 km/s)',17],['Tipo Parker (190 km/s)',190],['Nucleare/ionica (1.000 km/s)',1000],['Vela laser 0,2c',.2*c],['Astronave 0,9c',.9*c]].forEach(([s,v])=>{const T=km/v,be=v/c,g=1/Math.sqrt(1-be*be);h+=`<tr><td>${s}</td><td>Terra: ${fmtT(T)}${be>.1?`<br>A bordo: ${fmtT(T/g)} (γ=${g.toFixed(3)})`:''}</td></tr>`});$('#tr').innerHTML=h+'</table>'+n}
function openC(a){op(`<h3>Confronto</h3><select id="ca1">${OP}</select> vs <select id="ca2">${OP}</select><div id="cr"></div>`);$('#ca1').value=idx(a?a.id:'terra');$('#ca2').value=idx(a&&a.id=='marte'?'terra':'marte');$('#ca1').onchange=$('#ca2').onchange=cmp;cmp()}
function cmp(){const a=D[$('#ca1').value],b=D[$('#ca2').value],R=(l,f)=>`<tr><td>${l}</td><td>${f(a)}</td><td>${f(b)}</td></tr>`;$('#cr').innerHTML='<table>'+R('Diametro',o=>o.f[0])+R('Gravità',o=>o.f[1])+R('Temperatura',o=>o.f[2])+R('Età',o=>o.f[3])+R('Distanza (ly)',o=>fmtN(ly(o)))+R('Risorse',o=>o.tg.map(x=>TAGS[x]).join(', ')||'—')+R('Colonizzazione',o=>o.c+'/5 '+CL[o.c])+'</table>'}
function openR(){op(`<h3>Filtro risorse & colonizzazione</h3>${Object.entries(TAGS).map(([k,v])=>`<label style="display:block"><input type="checkbox" class="rt" value="${k}"> ${v}</label>`).join('')}<p>Indice minimo: <select id="ri">${CL.map((x,i)=>`<option value="${i}">${i}+ ${x}</option>`).join('')}</select></p><button id="rap">Evidenzia</button> <button id="rcl">Azzera</button>`);$('#rap').onclick=applyR;$('#rcl').onclick=()=>{document.querySelectorAll('.rt').forEach(x=>x.checked=false);$('#ri').value=0;applyR()}}
function applyR(){const ts=[...document.querySelectorAll('.rt:checked')].map(x=>x.value),mi=+$('#ri').value,on=ts.length||mi>0;D.forEach(o=>{if(o.fake)return;const ok=!on||((!ts.length||ts.some(x=>o.tg.includes(x)))&&o.c>=mi);o.m.material.transparent=true;o.m.material.opacity=ok?1:.15;o.m.scale.setScalar(on&&ok?1.5:1)})}
$('#bt').onclick=()=>openT(null,cur||byId.marte);$('#br').onclick=openR;$('#bc').onclick=()=>openC(cur);
$('#bs').onclick=()=>{real=!real;$('#bs').textContent='Scala: '+(real?'Reale':'Visiva');mkOrb();if(lvl==1)setLevel(1)};
$('#bn').onclick=()=>{const n=$('#nav');n.style.display=getComputedStyle(n).display=='none'?'block':'none'};
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>setLevel(+b.dataset.l));
$('#pp').onclick=()=>{play=!play;$('#pp').textContent=play?'⏸':'▶'};$('#rv').onclick=()=>dir*=-1;
[['1 ora/s',1/24],['1 giorno/s',1],['10 giorni/s',10],['100 giorni/s',100],['1 anno/s',365.25],['1.000 anni/s',365250],['1 Mln anni/s',3.6525e8]].forEach(([n,v],i)=>$('#sp').add(new Option(n,v,i==2,i==2)));$('#sp').onchange=()=>spd=+$('#sp').value;
$('#rst').onclick=()=>setLevel(lvl);
$('#co').onchange=e=>{showOrb=e.target.checked;orbs.forEach(l=>l.visible=showOrb)};$('#ca').onchange=e=>D.forEach(o=>o.ax&&(o.ax.visible=e.target.checked));$('#cg').onchange=e=>gh.forEach(g=>g&&(g.visible=e.target.checked));

const rc=new THREE.Raycaster(),mv=new THREE.Vector2();let dn;
